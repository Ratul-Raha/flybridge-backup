<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none" role="img" aria-label="IELTS Full Readiness Companion Book">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="900" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#153C69" />
      <stop offset="0.55" stop-color="#0B2545" />
      <stop offset="1" stop-color="#080B10" />
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05080D" stop-opacity="0.9" />
      <stop offset="1" stop-color="#05080D" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 120) scale(420 380)">
      <stop offset="0" stop-color="#14B57E" stop-opacity="0.28" />
      <stop offset="1" stop-color="#14B57E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="1200" rx="18" fill="url(#cover)" />
  <rect width="900" height="1200" rx="18" fill="url(#sheen)" />
  <rect x="0" y="0" width="90" height="1200" fill="url(#spine)" />
  <rect x="24" y="0" width="2" height="1200" fill="#14B57E" fill-opacity="0.35" />
  <rect x="1.5" y="1.5" width="897" height="1197" rx="17" fill="none" stroke="#14B57E" stroke-opacity="0.25" stroke-width="3" />

  <text x="130" y="120" fill="#14B57E" font-family="'Inter Variable', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">FLYBRIDGE EDUCATION GROUP</text>

  <text x="130" y="430" fill="#FFFFFF" font-family="'Inter Variable', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">IELTS</text>
  <text x="130" y="530" fill="#FFFFFF" font-family="'Inter Variable', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">Full</text>
  <text x="130" y="630" fill="#14B57E" font-family="'Inter Variable', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">Readiness</text>

  <rect x="130" y="700" width="96" height="4" rx="2" fill="#14B57E" />

  <g font-family="'Inter Variable', Arial, sans-serif" font-size="30" font-weight="500" fill="#A9BCD3">
    <text x="130" y="790">Companion Book</text>
    <text x="130" y="840">25 Video Masterclasses</text>
    <text x="130" y="890">Model Answers · Practice Tests</text>
  </g>

  <g transform="translate(130 1010)">
    <rect x="0" y="0" width="300" height="64" rx="32" fill="rgba(20,181,126,0.12)" stroke="#14B57E" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="150" y="41" fill="#7CF0BD" font-family="'Inter Variable', Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Included with the course</text>
  </g>
</svg>
